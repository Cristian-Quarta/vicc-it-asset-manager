<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Asset hinzufügen</title>
</head>

<body>

    <!-- Formular zur Erfassung eines neuen IT-Assets. -->
    <h1>Neues Asset hinzufügen</h1>

    <!--
        Die Formulardaten werden über HTTP POST an dieselbe Route (/add)
        gesendet und anschliessend durch Flask verarbeitet.
    -->
    <form method="POST">

        <!-- Der Hostname ist ein Pflichtfeld. -->
        <p>
            <label>Hostname:</label><br>
            <input type="text" name="hostname" required>
        </p>

        <!-- Auswahl des Asset-Typs. -->
        <p>
            <label>Typ:</label><br>
            <select name="type">
                <option value="Server">Server</option>
                <option value="Client">Client</option>
                <option value="Network">Netzwerkgerät</option>
                <option value="Other">Andere</option>
            </select>
        </p>

        <!-- Optionale technische Informationen zum Asset. -->
        <p>
            <label>Betriebssystem:</label><br>
            <input type="text" name="os">
        </p>

        <p>
            <label>IP-Adresse:</label><br>
            <input type="text" name="ip">
        </p>

        <p>
            <label>Standort:</label><br>
            <input type="text" name="location">
        </p>

        <!-- Auswahl des aktuellen Betriebsstatus. -->
        <p>
            <label>Status:</label><br>
            <select name="status">
                <option value="Online">Online</option>
                <option value="Offline">Offline</option>
                <option value="Maintenance">Wartung</option>
            </select>
        </p>

        <!-- Sendet das ausgefüllte Formular an die Flask-Anwendung. -->
        <button type="submit">
            Asset speichern
        </button>

    </form>

    <!-- Rückkehr zur Asset-Übersicht ohne einen neuen Eintrag zu erstellen. -->
    <p>
        <a href="/">Zurück zum IT Asset Manager</a>
    </p>

</body>

</html>
