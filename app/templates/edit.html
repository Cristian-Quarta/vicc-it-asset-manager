<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Asset bearbeiten</title>
</head>

<body>

    <!--
        Formular zum Bearbeiten eines bestehenden IT-Assets.
        Das aktuelle Asset wird von Flask an dieses Template übergeben.
    -->
    <h1>Asset bearbeiten</h1>

    <!--
        Die geänderten Werte werden per HTTP POST an die aktuelle
        Edit-Route des Assets zurückgesendet.
    -->
    <form method="POST">

        <!--
            Die bestehenden Werte werden über Jinja in die Formularfelder
            eingesetzt, damit sie direkt bearbeitet werden können.
        -->
        <p>
            <label>Hostname:</label><br>
            <input
                type="text"
                name="hostname"
                value="{{ asset.hostname }}"
                required
            >
        </p>

        <p>
            <label>Typ:</label><br>

            <select name="type">

                <!--
                    Jinja prüft den aktuell gespeicherten Asset-Typ und
                    markiert die entsprechende Option als ausgewählt.
                -->
                <option value="Server"
                    {% if asset.type == "Server" %}selected{% endif %}>
                    Server
                </option>

                <option value="Client"
                    {% if asset.type == "Client" %}selected{% endif %}>
                    Client
                </option>

                <option value="Network"
                    {% if asset.type == "Network" %}selected{% endif %}>
                    Netzwerkgerät
                </option>

                <option value="Other"
                    {% if asset.type == "Other" %}selected{% endif %}>
                    Andere
                </option>

            </select>

        </p>

        <!-- Optionale technische Informationen des Assets. -->
        <p>
            <label>Betriebssystem:</label><br>
            <input
                type="text"
                name="os"
                value="{{ asset.os }}"
            >
        </p>

        <p>
            <label>IP-Adresse:</label><br>
            <input
                type="text"
                name="ip"
                value="{{ asset.ip }}"
            >
        </p>

        <p>
            <label>Standort:</label><br>
            <input
                type="text"
                name="location"
                value="{{ asset.location }}"
            >
        </p>

        <p>
            <label>Status:</label><br>

            <select name="status">

                <!--
                    Der aktuell gespeicherte Status wird beim Öffnen
                    des Formulars automatisch vorausgewählt.
                -->
                <option value="Online"
                    {% if asset.status == "Online" %}selected{% endif %}>
                    Online
                </option>

                <option value="Offline"
                    {% if asset.status == "Offline" %}selected{% endif %}>
                    Offline
                </option>

                <option value="Maintenance"
                    {% if asset.status == "Maintenance" %}selected{% endif %}>
                    Wartung
                </option>

            </select>

        </p>

        <!-- Speichert die vorgenommenen Änderungen über die Flask-Route. -->
        <button type="submit">
            Änderungen speichern
        </button>

    </form>

    <!-- Abbruch der Bearbeitung und Rückkehr zur Übersicht. -->
    <p>
        <a href="/">Abbrechen</a>
    </p>

</body>

</html>
