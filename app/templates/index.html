<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>IT Asset Manager</title>
</head>

<body>

    <!--
        Hauptseite des IT Asset Managers.
        Die Variable "assets" wird von Flask aus der Datenbank geladen
        und beim Rendern an dieses Template übergeben.
    -->
    <h1>IT Asset Manager</h1>

    <!-- Navigation zum Formular für die Erfassung eines neuen Assets. -->
    <p>
        <a href="/add">+ Neues Asset hinzufügen</a>
    </p>

    <!-- Tabelle zur Darstellung aller in PostgreSQL gespeicherten Assets. -->
    <table border="1">

        <thead>
            <tr>
                <th>ID</th>
                <th>Hostname</th>
                <th>Typ</th>
                <th>Betriebssystem</th>
                <th>IP-Adresse</th>
                <th>Standort</th>
                <th>Status</th>
                <th>Aktionen</th>
            </tr>
        </thead>

        <tbody>

            <!--
                Jinja-Schleife:
                Für jedes von Flask übergebene Asset wird eine eigene
                Tabellenzeile erzeugt.
            -->
            {% for asset in assets %}

            <tr>
                <td>{{ asset.id }}</td>
                <td>{{ asset.hostname }}</td>
                <td>{{ asset.type }}</td>
                <td>{{ asset.os }}</td>
                <td>{{ asset.ip }}</td>
                <td>{{ asset.location }}</td>
                <td>{{ asset.status }}</td>

                <td>

                    <!-- Öffnet das Bearbeitungsformular des gewählten Assets. -->
                    <a href="/edit/{{ asset.id }}">
                        Bearbeiten
                    </a>

                    <!--
                        Das Löschen wird bewusst über eine POST-Anfrage
                        ausgeführt. Vor dem Absenden wird zusätzlich eine
                        Bestätigung im Browser angezeigt.
                    -->
                    <form
                        action="/delete/{{ asset.id }}"
                        method="POST"
                        style="display:inline;"
                        onsubmit="return confirm('Asset wirklich löschen?');"
                    >
                        <button type="submit">
                            Löschen
                        </button>
                    </form>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</body>

</html>
